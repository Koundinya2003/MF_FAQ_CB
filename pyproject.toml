[project]
name = "fundbot"
version = "2.0.0"
description = "Facts-only FAQ assistant for Mirae Asset mutual fund schemes"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
